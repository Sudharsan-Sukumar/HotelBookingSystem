<div class="container-fluid p-0 login-container forgot-password-page">
  <div class="row g-0 min-vh-100">

    <!-- Left Panel (Salem Luxury Image Column) -->
    <div class="col-lg-5 d-none d-lg-block position-relative image-panel-column">
      <div class="image-panel" style="background-image: url('/assets/images/forgot_hero.jpg');">
        <div class="curved-border-overlay"></div>
      </div>
    </div>

    <!-- Right Panel (Password Reset Form Column) -->
    <div class="col-lg-7 col-12 d-flex align-items-center justify-content-center form-panel-column bg-light-ivory">
      <div class="w-100 py-4 form-inner-wrapper">

        <!-- Back navigation options -->
        <div class="text-center mb-3">
          <a routerLink="/auth/login" class="back-home-link">
            <i class="bi bi-arrow-left"></i> Back to Login
          </a>
        </div>

        <!-- Hero Heading -->
        <div class="text-center mb-4 px-3">
          <h1 class="login-hero-heading text-uppercase">Forgot Password</h1>
          <p class="login-hero-sub">Follow steps to recover your credentials</p>
        </div>

        <!-- Reset Card -->
        <div class="login-card mx-auto">

          <!-- Dynamic Alert Box for Success/Error Notification Messages -->
          <div class="alert mb-3 small py-2 px-3 text-start" [ngClass]="'alert-' + statusAlert.type" *ngIf="statusAlert" role="alert">{{ statusAlert.message }}</div>

          <form novalidate (submit)="onSubmit(); $event.preventDefault()">

            <div class="small mb-3 text-start"><span style="color:red">*</span> Required fields</div>

            <!-- Registered Email Section -->
            <div class="mb-3 text-start">
              <label for="resetEmail" class="form-label">Registered Email <span style="color:red">*</span></label>
              <div class="input-container">
                <input type="email" id="resetEmail" name="resetEmail" class="form-control" [class.is-invalid]="emailInvalid" placeholder="Enter your email address" required
                  [(ngModel)]="email" [disabled]="step > 1">
                <span class="invalid-feedback-msg" *ngIf="emailInvalid">{{ emailError }}</span>
              </div>
            </div>

            <!-- Send OTP Trigger -->
            <div class="mb-4" *ngIf="step < 3">
              <button type="button" id="btnSendOTP" class="btn btn-login-submit w-100" [disabled]="isSubmitting" (click)="onSendOtpOrVerify()">{{ step === 1 ? (isSubmitting ? 'Sending...' : 'Send OTP') : 'Continue' }}</button>
            </div>

            <hr class="my-4" style="border-top: 1px dashed rgba(212, 175, 55, 0.3);">

            <!-- OTP Verification Code Input -->
            <div class="mb-3 text-start">
              <label for="otpCode" class="form-label">Enter OTP <span style="color:red">*</span></label>
              <div class="input-container">
                <input type="text" id="otpCode" name="otpCode" class="form-control text-center fw-bold" [class.is-invalid]="otpInvalid" placeholder="Verification code" maxlength="6" [disabled]="step < 2 || step > 2" required
                  [(ngModel)]="otp">
                <span class="invalid-feedback-msg" *ngIf="otpInvalid">{{ otpError }}</span>
              </div>
            </div>

            <!-- Current Password input -->
            <div class="mb-3 text-start">
              <label for="oldPassword" class="form-label">Current Password <span style="color:red">*</span></label>
              <div class="input-container">
                <input [type]="passwordType" id="oldPassword" name="oldPassword" class="form-control" [class.is-invalid]="oldPasswordInvalid" placeholder="Enter current password" [disabled]="step < 3 || resetComplete" required
                  [(ngModel)]="oldPassword">
                <span class="invalid-feedback-msg" *ngIf="oldPasswordInvalid">{{ oldPasswordError }}</span>
              </div>
            </div>

            <!-- New Password input -->
            <div class="mb-3 text-start">
              <label for="newPassword" class="form-label">New Password <span style="color:red">*</span></label>
              <div class="input-container">
                <input [type]="passwordType" id="newPassword" name="newPassword" class="form-control" [class.is-invalid]="newPasswordInvalid" placeholder="Enter new password" [disabled]="step < 3 || resetComplete" required
                  [(ngModel)]="newPassword">
                <span class="invalid-feedback-msg" *ngIf="newPasswordInvalid">{{ newPasswordError }}</span>
              </div>
            </div>

            <!-- Confirm Password input -->
            <div class="mb-3 text-start">
              <label for="confirmPassword" class="form-label">Confirm Password <span style="color:red">*</span></label>
              <div class="input-container">
                <input [type]="passwordType" id="confirmPassword" name="confirmPassword" class="form-control" [class.is-invalid]="confirmPasswordInvalid" placeholder="Confirm new password" [disabled]="step < 3 || resetComplete" required
                  [(ngModel)]="confirmPassword">
                <span class="invalid-feedback-msg" *ngIf="confirmPasswordInvalid">{{ confirmPasswordError }}</span>
              </div>
            </div>

            <!-- Show Password checkbox -->
            <div class="mb-4 form-check text-start d-flex align-items-center gap-2">
              <input type="checkbox" class="form-check-input" id="showPassword" name="showPassword" [disabled]="step < 3 || resetComplete"
                [(ngModel)]="showPassword">
              <label class="form-check-label checkbox-label" for="showPassword">Show Password</label>
            </div>

            <!-- Reset Password button action -->
            <div>
              <button type="submit" id="btnResetPassword" class="btn btn-login-submit w-100" [disabled]="step < 3 || resetComplete || isSubmitting">{{ isSubmitting ? 'Processing...' : 'Reset Password' }}</button>
            </div>

          </form>
        </div>

      </div>
    </div>

  </div>
</div>
