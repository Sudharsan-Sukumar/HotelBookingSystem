<div class="d-flex admin-layout admin-body">
<app-admin-top-nav></app-admin-top-nav>

<div class="container-fluid px-4 py-4 flex-grow-1 admin-content overflow-auto">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a routerLink="/admin/dashboard" class="text-decoration-none" style="color: #6c757d;">Home</a></li>
        <li class="breadcrumb-item"><a routerLink="/admin/content" class="text-decoration-none" style="color: #6c757d;">Content</a></li>
        <li class="breadcrumb-item active" style="color: #1A0A2E; font-weight: 500;">Homepage Layout</li>
      </ol>
    </nav>
    <a routerLink="/admin/content" class="btn btn-outline-purple btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Content</a>
  </div>

  <div class="mb-4 text-start">
    <h1 class="font-serif fw-bold text-purple h2 mb-1">Configure Homepage Layout</h1>
    <p class="text-secondary small mb-0">Control visibility states and reorder sections shown on the customer website.</p>
  </div>

  <div class="card border bg-white p-4 shadow-sm text-start mx-auto" style="border-radius: 16px; max-width: 700px;">
    <h6 class="text-purple fw-bold mb-3">Homepage Modules</h6>

    <div class="d-flex flex-column gap-2 mb-4">
      <div class="draggable-section-item p-3 bg-white rounded d-flex justify-content-between align-items-center" *ngFor="let section of sections; let i = index">
        <div class="d-flex align-items-center">
          <div class="d-flex flex-column me-2">
            <button type="button" class="btn btn-sm btn-link p-0 text-muted" [disabled]="i === 0" (click)="moveUp(i)" title="Move up"><i class="bi bi-caret-up-fill"></i></button>
            <button type="button" class="btn btn-sm btn-link p-0 text-muted" [disabled]="i === sections.length - 1" (click)="moveDown(i)" title="Move down"><i class="bi bi-caret-down-fill"></i></button>
          </div>
          <i class="bi {{ section.icon }} me-2 text-muted"></i> <strong>{{ section.label }}</strong>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" [checked]="section.enabled" (change)="toggleEnabled(section)">
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-purple btn-sm" routerLink="/admin/content">Cancel</button>
      <button type="button" class="btn btn-purple btn-sm" (click)="saveLayout()"><i class="bi bi-save me-1"></i> Save Layout Order</button>
    </div>
  </div>
</div>
</div>
