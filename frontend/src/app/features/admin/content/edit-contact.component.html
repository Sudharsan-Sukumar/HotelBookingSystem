<div class="text-start">
  <h6 class="font-serif fw-bold text-purple mb-1">Contact &amp; Footer</h6>
  <p class="text-secondary small mb-3">Configure receptionist phone, email, and footer address details.</p>

  <div *ngIf="loading" class="text-center text-muted py-4 small">Loading&hellip;</div>

  <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)" novalidate *ngIf="!loading">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label small fw-semibold">Phone Number *</label>
        <input type="text" name="phone" class="form-control form-control-sm" [(ngModel)]="phone" (ngModelChange)="pushPreview()" #phoneField="ngModel" required>
        <div class="text-danger small mt-1" *ngIf="phoneInvalid && (phoneField.dirty || contactForm.submitted)">Please enter a valid phone number.</div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Email Address *</label>
        <input type="email" name="email" class="form-control form-control-sm" [(ngModel)]="email" (ngModelChange)="pushPreview()" #emailField="ngModel" required>
        <div class="text-danger small mt-1" *ngIf="emailInvalid && (emailField.dirty || contactForm.submitted)">Please enter a valid email address.</div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Footer Address Details *</label>
        <input type="text" name="address" class="form-control form-control-sm" [(ngModel)]="address" maxlength="300" required>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="submit" class="btn btn-purple btn-sm" [disabled]="saving"><i class="bi bi-save me-1"></i> Publish Content</button>
    </div>
  </form>
</div>
