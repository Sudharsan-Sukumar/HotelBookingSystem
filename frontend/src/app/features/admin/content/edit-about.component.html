<div class="text-start">
  <h6 class="font-serif fw-bold text-purple mb-1">About Us</h6>
  <p class="text-secondary small mb-3">Configure company highlights and brand story text copy.</p>

  <div *ngIf="loading" class="text-center text-muted py-4 small">Loading&hellip;</div>

  <form #aboutForm="ngForm" (ngSubmit)="onSubmit(aboutForm)" novalidate *ngIf="!loading">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label small fw-semibold">Heading *</label>
        <input type="text" name="heading" class="form-control form-control-sm" [(ngModel)]="heading" (ngModelChange)="pushPreview()" #headingField="ngModel" maxlength="200" required>
        <div class="text-danger small mt-1" *ngIf="headingField.invalid && (headingField.dirty || aboutForm.submitted)">Heading is required.</div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Sub-Heading *</label>
        <input type="text" name="subheading" class="form-control form-control-sm" [(ngModel)]="subheading" (ngModelChange)="pushPreview()" #subheadingField="ngModel" maxlength="300" required>
        <div class="text-danger small mt-1" *ngIf="subheadingField.invalid && (subheadingField.dirty || aboutForm.submitted)">Sub-heading is required.</div>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Brand History *</label>
        <textarea name="history" class="form-control form-control-sm" rows="4" [(ngModel)]="history" #historyField="ngModel" maxlength="5000" required></textarea>
        <div class="text-danger small mt-1" *ngIf="historyField.invalid && (historyField.dirty || aboutForm.submitted)">Brand history is required.</div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="submit" class="btn btn-purple btn-sm" [disabled]="saving"><i class="bi bi-save me-1"></i> Publish Content</button>
    </div>
  </form>
</div>
