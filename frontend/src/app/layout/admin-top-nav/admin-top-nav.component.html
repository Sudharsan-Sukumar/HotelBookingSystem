<div id="admin-sidebar-container" [class.collapsed]="collapsed" [class.show]="mobileOpen">
  <div class="admin-sidebar d-flex flex-column">
    <!-- Sidebar Header: Logo -->
    <div class="sidebar-header d-flex align-items-center gap-3 p-4 border-bottom" style="border-color: rgba(255,255,255,0.1) !important;">
      <img src="/assets/images/logo.png" alt="Elegant Enclave Logo" class="sidebar-logo" style="width: 48px; height: 48px; object-fit: contain; border-radius: 50%; border: 1.5px solid #D4AF37;">
      <div class="sidebar-brand d-flex flex-column text-truncate">
        <span class="brand-name fw-bold font-serif text-white mb-0" style="font-size: 1.2rem; letter-spacing: 0.5px;">Elegant<span style="color: #D4AF37;">Enclave</span></span>
        <span class="brand-role text-white-50" style="font-size: 0.75rem;">System Administration</span>
      </div>
    </div>

    <!-- Sidebar Navigation -->
    <div class="sidebar-body flex-grow-1 overflow-y-auto py-3 custom-scrollbar">
      <ul class="nav flex-column gap-1 px-3">
        <li class="nav-item" *ngFor="let link of navLinks">
          <a
            class="nav-link sidebar-link text-white d-flex align-items-center gap-3"
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            [title]="link.label"
            (click)="onNavLinkClick()"
          >
            <i class="bi {{ link.icon }} fs-5 sidebar-icon"></i>
            <span class="link-text">{{ link.label }}</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Sidebar Footer: User Profile Dropdown -->
    <div class="sidebar-footer p-3 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
      <div class="dropdown dropup d-flex align-items-center w-100">
        <button
          class="btn dropdown-toggle d-flex align-items-center gap-3 p-2 text-white border-0 w-100 sidebar-profile-btn text-start rounded"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          style="background: transparent; box-shadow: none;"
        >
          <div class="profile-avatar-circle" style="width: 44px; height: 44px; border: 2px solid #D4AF37; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; background-color: rgba(255,255,255,0.1); font-size: 1.1rem; flex-shrink: 0;">{{ userInitials }}</div>
          <div class="lh-sm text-white d-flex flex-column justify-content-center flex-grow-1 text-truncate sidebar-profile-text">
            <strong class="d-block mb-1 text-nowrap" style="font-size: 0.9rem !important; line-height: 1;">{{ userName }}</strong>
            <span class="text-white-50 d-block text-nowrap" style="font-size: 0.75rem !important; line-height: 1;">{{ userRole }}</span>
          </div>
          <span class="text-warning sidebar-profile-arrow" style="font-size: 0.8rem;">&#9660;</span>
        </button>
        <ul class="dropdown-menu shadow border border-warning mb-2" style="background-color: #1A0A2E; min-width: 220px;">
          <li><a class="dropdown-item py-2 px-3 text-white small" routerLink="/admin/profile"><i class="bi bi-person-fill me-2"></i> View Profile</a></li>
          <li><hr class="dropdown-divider bg-secondary opacity-25"></li>
          <li><a class="dropdown-item py-2 px-3 text-danger small" href="javascript:void(0)" (click)="onLogoutClick($event)"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- Mobile Overlay -->
<div class="sidebar-overlay d-lg-none" [class.show]="mobileOpen" (click)="closeMobileSidebar()"></div>

<!-- Mobile Toggle Button (fixed, shown on small screens) -->
<button class="btn admin-mobile-toggle d-lg-none" type="button" (click)="toggleSidebar()">
  <i class="bi bi-list fs-4"></i>
</button>
