<!-- NAVBAR -->
<nav class="navbar navbar-expand-xl custom-navbar sticky-top">
  <div class="container-fluid px-xl-5">
    <a class="navbar-brand d-flex align-items-center" routerLink="/" aria-label="Elegant Enclave Home">
      <img src="/assets/images/logo.png" alt="Elegant Enclave logo" class="brand-logo-img me-2">
      Elegant<span>Enclave</span>
    </a>

    <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto mb-2 mb-xl-0 align-items-center gap-1 gap-xxl-3">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/hotels/search" routerLinkActive="active" (click)="guardedNav('/hotels/search', $event)">Hotels</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-nowrap" routerLink="/candidate/my-bookings" routerLinkActive="active" (click)="guardedNav('/candidate/my-bookings', $event)">My Bookings</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-nowrap" routerLink="/bookings/notifications" routerLinkActive="active" (click)="guardedNav('/bookings/notifications', $event)">Notifications</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="profileLink()" routerLinkActive="active" (click)="guardedNav(profileLink(), $event)">Profile</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3 align-middle flex-wrap justify-content-center justify-content-xl-end">
        <div class="d-flex align-items-center gap-2">
          <div *ngIf="!isLoggedIn" class="d-flex align-items-center gap-2">
            <a routerLink="/auth/login" class="btn btn-auth-outline btn-sm text-nowrap d-flex align-items-center justify-content-center">Login</a>
            <a routerLink="/auth/register" class="btn btn-auth-gold btn-sm text-nowrap d-flex align-items-center justify-content-center">Register</a>
          </div>

          <div *ngIf="isLoggedIn" class="auth-logged-in d-flex align-items-center gap-3 cursor-pointer position-relative" (click)="toggleDropdown()">
            <div class="user-info d-none d-md-block text-end">
              <p class="user-name text-white">{{ userName }}</p>
              <p class="user-role">{{ userRole }}</p>
              <p class="user-email">{{ userEmail }}</p>
            </div>
            <div class="profile-avatar" [style.background]="photoUrl ? ('url(' + photoUrl + ') center/cover no-repeat') : null"></div>
            <i class="bi bi-chevron-down text-white-50" style="font-size:0.7rem;"></i>

            <ul *ngIf="dropdownOpen" class="dropdown-menu dropdown-menu-end shadow border border-warning show" style="background-color:#1A0A2E; position:absolute; right:0; top:100%; z-index:1000; min-width:160px;">
              <li><a class="dropdown-item py-2 px-3 text-white small" [routerLink]="profileLink()">View Profile</a></li>
              <li><hr class="dropdown-divider bg-secondary opacity-25 my-1"></li>
              <li><a class="dropdown-item py-2 px-3 text-danger small" href="javascript:void(0)" (click)="logout()">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
