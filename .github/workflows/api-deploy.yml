name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/HotelBooking.API/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # match your TargetFramework from Phase 0

      - name: Publish
        run: dotnet publish backend/HotelBooking.API/HotelBooking.API.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: hotelbooking-capstone-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish