name: Deploy API to Azure App Service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/HotelBooking.API/**'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish backend/HotelBooking.API/HotelBooking.API.csproj -c Release -o ./publish
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: hotelbooking-capstone-api
          publish-profile: ${{ secrets.HOTELBOOKING_API_PUBLISH_PROFILE }}
          package: ./publish
