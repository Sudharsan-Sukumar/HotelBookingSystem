<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Hotel - Elegant Enclave Admin</title>
  <link rel='icon' type='image/png' href='../../../assets/images/logo.png'>
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../../Shared/Abstracts/global.css">
  <link rel="stylesheet" href="../Manager/dashboard.css?v=1.9">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="components/admin-sidebar.css">
</head>
<body class="admin-body">

    




  <!-- Main Layout Wrapper -->
<div class="d-flex" style="min-height: 100vh;">
    <!-- Sidebar Container -->
    <div id="admin-sidebar-container"></div>
    
    <!-- Main Content Area -->
    <div class="flex-grow-1 d-flex flex-column bg-light" style="min-width: 0;">
        
        <!-- Lightweight Header -->
        <header class="d-flex justify-content-between align-items-center p-3 bg-white border-bottom sticky-top shadow-sm">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light d-lg-none" id="mobile-sidebar-toggle"><i class="bi bi-list fs-4"></i></button>
                <h5 class="mb-0 font-serif fw-bold text-dark" id="header-page-title">Add Hotel</h5>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <a href="notifications.html" class="position-relative text-dark p-2" style="text-decoration: none;">
                    <i class="bi bi-bell-fill fs-5 text-warning"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem; transform: translate(-30%, -10%); border: 2px solid #ffffff;">3</span>
                </a>
            </div>
        </header>

        <div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none" style="color: #6c757d;">Home</a></li>
          <li class="breadcrumb-item"><a href="hotels.html" class="text-decoration-none" style="color: #6c757d;">Hotels</a></li>
          <li class="breadcrumb-item active" style="color: #1A0A2E; font-weight: 500;">Add Hotel</li>
        </ol>
      </nav>
      <a href="hotels.html" class="btn btn-outline-purple btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Hotel Management</a>
    </div>

    <div class="mb-4 text-start">
      <h1 class="font-serif fw-bold text-purple h2 mb-1">Add New Hotel</h1>
      <p class="text-secondary small mb-0">Establish a new hotel branch location profile config.</p>
    </div>

    <!-- ADD HOTEL FORM -->
    <div class="card border bg-white p-4 shadow-sm text-start mx-auto" style="border-radius: 16px; max-width: 900px;">
      <form id="addHotelForm" novalidate>
        <div class="mb-3 text-danger small">* denotes that the field is mandatory</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Hotel Name *</label>
            <input type="text" class="form-control form-control-sm" id="hotelName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Branch Name *</label>
            <input type="text" class="form-control form-control-sm" id="branchName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">City *</label>
            <select class="form-select form-select-sm" id="city" required>
              <option value="">Select City/District</option>
              <option value="Salem">Salem</option>
              <option value="Coimbatore">Coimbatore</option>
              <option value="Chennai">Chennai</option>
              <option value="Others">Others</option>
            </select>
            <div id="otherCityContainer" class="mt-2 d-none">
              <input type="text" class="form-control form-control-sm" id="otherCity" placeholder="Specify district name">
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Contact Number *</label>
            <input type="text" class="form-control form-control-sm" id="contact" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Email Address *</label>
            <input type="email" class="form-control form-control-sm" id="email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Assigned Manager</label>
            <select class="form-select form-select-sm" id="manager">
              <option value="">Unassigned</option>
              <option value="Suresh Patel">Suresh Patel (Active, Unassigned)</option>
              <option value="Gita Reddy">Gita Reddy (Active, Unassigned)</option>
            </select>
          </div>
          <div class="col-md-12">
            <label class="form-label small fw-semibold">Address *</label>
            <textarea class="form-control small" id="address" rows="2" required></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-outline-purple btn-sm" onclick="location.href='hotels.html'">Cancel</button>
          <button type="submit" class="btn btn-purple btn-sm"><i class="bi bi-check-lg me-1"></i> Save Hotel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- STATUS TOAST -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="statusToast" class="toast align-items-center text-white border-0 shadow" role="alert">
      <div class="d-flex">
        <div class="toast-body small" id="toastMessage">Updates saved.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-toast="dismiss"></button>
      </div>
    </div>
  </div>

  <footer class="py-4 text-center mt-5" style="background-color: #1A0A2E; border-top: 2px solid #D4AF37;">
    <p class="text-white small mb-0">&copy; 2026 Elegant Enclave. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const citySelect = document.getElementById('city');
    const otherCityContainer = document.getElementById('otherCityContainer');
    const otherCityInput = document.getElementById('otherCity');

    // Populate managers dropdown
    if (window.HotelState) {
      const mgrSelect = document.getElementById('manager');
      if (mgrSelect) {
        mgrSelect.innerHTML = '<option value="">Unassigned</option>';
        const managers = HotelState.users.filter(u => u.role === 'Manager' && u.status === 'Active');
        managers.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.firstName ? `${m.firstName} ${m.lastName}` : (m.name || m.email);
          mgrSelect.appendChild(opt);
        });
      }
    }

    citySelect.addEventListener('change', () => {
      if (citySelect.value === 'Others') {
        otherCityContainer.classList.remove('d-none');
        otherCityInput.setAttribute('required', 'required');
      } else {
        otherCityContainer.classList.add('d-none');
        otherCityInput.removeAttribute('required');
        otherCityInput.value = '';
        otherCityInput.classList.remove('is-invalid');
      }
    });

    document.getElementById('addHotelForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let isValid = true;
      const requiredFields = e.target.querySelectorAll('[required]');
      requiredFields.forEach(f => {
        if (f.id === 'otherCity' && otherCityContainer.classList.contains('d-none')) {
          return;
        }
        if (!f.value.trim()) {
          f.classList.add('is-invalid');
          isValid = false;
        } else {
          f.classList.remove('is-invalid');
        }
      });
      if (isValid) {
        const newHotelCity = citySelect.value === 'Others' ? otherCityInput.value.trim() : citySelect.value;
        const name = document.getElementById('hotelName').value;
        const branch = document.getElementById('branchName').value;
        const managerId = document.getElementById('manager').value;
        const managerName = managerId ? HotelState.users.find(u => u.id === managerId)?.name : 'Unassigned';

        const list = HotelState.hotels || [];
        const nextId = 'HTL' + String(list.length + 1).padStart(3, '0');

        const newHotel = {
          id: nextId,
          name: name,
          branch: branch,
          city: newHotelCity,
          manager: managerName || 'Unassigned',
          managerId: managerId || null,
          rooms: 0,
          status: 'Active',
          createdAt: new Date().toISOString()
        };

        list.push(newHotel);
        HotelState.hotels = list;

        // If manager assigned, update manager's hotel assignment
        if (managerId) {
          const uList = HotelState.users;
          const uIdx = uList.findIndex(u => u.id === managerId);
          if (uIdx !== -1) {
            uList[uIdx].assignedHotelId = nextId;
            uList[uIdx].branch = name;
            HotelState.users = uList;
          }
        }

        // Add audit log

        const toastEl = document.getElementById('statusToast');
        document.getElementById('toastMessage').textContent = `Hotel Created Successfully in ${newHotelCity}.`;
        toastEl.classList.add('bg-success');
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
        setTimeout(() => {
          location.href = 'hotels.html';
        }, 1500);
      }
    });
  </script>
  <script src="../../../Shared/UtilityClass/state.js"></script>
  <script src="../../../Shared/UtilityClass/session.js"></script>
  <script src="components/admin-sidebar.js"></script>
  </div>
</div>
</body>
</html>
