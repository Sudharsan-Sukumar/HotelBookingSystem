<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razorpay Checkout – Elegant Enclave</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #FAF8F4;
      color: #1A0A2E;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box { max-width: 420px; padding: 2rem; }
    .spinner {
      width: 48px; height: 48px; margin: 0 auto 1.5rem;
      border: 4px solid rgba(212,175,55,0.25);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-icon { font-size: 3rem; margin-bottom: 1rem; }
    h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    p { color: #6b6b6b; font-size: 0.95rem; }
    .success { color: #1f8a3b; }
    .failure { color: #c0392b; }
  </style>
</head>
<body>
  <div class="box" id="statusBox">
    <div class="spinner"></div>
    <h2>Opening Razorpay Checkout…</h2>
    <p>Please don't close this tab.</p>
  </div>

  <script src="razorpay_checkout.js"></script>
</body>
</html>
