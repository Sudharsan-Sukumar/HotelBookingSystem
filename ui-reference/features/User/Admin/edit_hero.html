<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Hero Banner - Elegant Enclave Admin</title>
  <link rel='icon' type='image/png' href='../../../assets/images/logo.png'>
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../../Shared/Abstracts/global.css">
  <link rel="stylesheet" href="../Manager/dashboard.css?v=1.9">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="components/admin-sidebar.css">
</head>
<body class="admin-body">

    




  <!-- Main Layout Wrapper -->
<div class="d-flex" style="min-height: 100vh;">
    <!-- Sidebar Container -->
    <div id="admin-sidebar-container"></div>
    
    <!-- Main Content Area -->
    <div class="flex-grow-1 d-flex flex-column bg-light" style="min-width: 0;">
        
        <!-- Lightweight Header -->
        <header class="d-flex justify-content-between align-items-center p-3 bg-white border-bottom sticky-top shadow-sm">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light d-lg-none" id="mobile-sidebar-toggle"><i class="bi bi-list fs-4"></i></button>
                <h5 class="mb-0 font-serif fw-bold text-dark" id="header-page-title">Edit Hero Banner</h5>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <a href="notifications.html" class="position-relative text-dark p-2" style="text-decoration: none;">
                    <i class="bi bi-bell-fill fs-5 text-warning"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem; transform: translate(-30%, -10%); border: 2px solid #ffffff;">3</span>
                </a>
            </div>
        </header>

        <div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none" style="color: #6c757d;">Home</a></li>
          <li class="breadcrumb-item"><a href="content.html" class="text-decoration-none" style="color: #6c757d;">Content</a></li>
          <li class="breadcrumb-item active" style="color: #1A0A2E; font-weight: 500;">Hero Banner</li>
        </ol>
      </nav>
      <a href="content.html" class="btn btn-outline-purple btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Content</a>
    </div>

    <div class="mb-4 text-start">
      <h1 class="font-serif fw-bold text-purple h2 mb-1">Edit Hero Banner</h1>
      <p class="text-secondary small mb-0">Configure primary landing visual headers and target buttons.</p>
    </div>

    <div class="card border bg-white p-4 shadow-sm text-start mx-auto" style="border-radius: 16px; max-width: 900px;">
      <form id="heroBannerForm">
        <div class="row g-3">
          <div class="col-md-12">
            <label class="form-label small fw-semibold">Main Heading *</label>
            <input type="text" id="txtHeroTitle" class="form-control form-control-sm" value="Escape to Elegant Luxury" required>
          </div>
          <div class="col-md-12">
            <label class="form-label small fw-semibold">Sub Heading *</label>
            <input type="text" id="txtHeroSub" class="form-control form-control-sm" value="Discover premium suites across India." required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Primary Button Text</label>
            <input type="text" class="form-control form-control-sm" value="Book Now">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Primary Button URL</label>
            <input type="text" class="form-control form-control-sm" value="/bookings">
          </div>
          <div class="col-md-12">
            <label class="form-label small fw-semibold">Banner Image URL</label>
            <input type="text" id="txtHeroImg" class="form-control form-control-sm" value="assets/images/hero_bg.png">
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-outline-purple btn-sm" onclick="location.href='content.html'">Cancel</button>
          <button type="submit" class="btn btn-purple btn-sm"><i class="bi bi-save me-1"></i> Publish Content</button>
        </div>
      </form>
    </div>
  </div>

  <!-- STATUS TOAST -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="statusToast" class="toast align-items-center text-white border-0 shadow" role="alert">
      <div class="d-flex">
        <div class="toast-body small" id="toastMessage">Updates saved.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-toast="dismiss"></button>
      </div>
    </div>
  </div>

  <footer class="py-4 text-center mt-5" style="background-color: #1A0A2E; border-top: 2px solid #D4AF37;">
    <p class="text-white small mb-0">&copy; 2026 Elegant Enclave. All rights reserved.</p>
  </footer>

  <script src="../../../Shared/UtilityClass/state.js"></script>
  <script src="../../../Shared/UtilityClass/session.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const c = HotelState.content || {};
      const hero = c.hero || {};

      const inputs = document.querySelectorAll('form input');
      if (inputs.length >= 5) {
        inputs[0].value = hero.tagline || '';
        inputs[1].value = hero.subtitle || '';
        inputs[2].value = hero.ctaText || '';
        inputs[3].value = hero.ctaLink || '/bookings'; // fallback if no link in schema
        inputs[4].value = hero.backgroundImage || '';
      }

      document.getElementById('heroBannerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const inputsSubmit = document.querySelectorAll('form input');
        
        c.hero = {
          tagline: inputsSubmit[0].value,
          subtitle: inputsSubmit[1].value,
          ctaText: inputsSubmit[2].value,
          ctaLink: inputsSubmit[3].value,
          backgroundImage: inputsSubmit[4].value
        };

        HotelState.content = c;

        

        const toastEl = document.getElementById('statusToast');
        document.getElementById('toastMessage').textContent = 'Content Published Successfully.';
        toastEl.className = 'toast align-items-center text-white border-0 shadow bg-success';
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
        setTimeout(() => {
          location.href = 'content.html';
        }, 1500);
      });
    });
  </script>
  <script src="components/admin-sidebar.js"></script>
  </div>
</div>
</body>
</html>
