<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Management - Elegant Enclave CMS</title>
  <link rel='icon' type='image/png' href='../../../assets/images/logo.png'>
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../../Shared/Abstracts/global.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="components/admin-sidebar.css">
  <style>
    .cms-controls::-webkit-scrollbar {
      width: 6px;
    }
    .cms-controls::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .cms-controls::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }
    .accordion-button:not(.collapsed) {
      background-color: #f8f5ff;
      color: #1A0A2E;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,.125);
    }
    .accordion-button:focus {
      box-shadow: none;
      border-color: rgba(0,0,0,.125);
    }
    .iframe-device-mobile { max-width: 414px !important; margin: 0 auto; }
    .iframe-device-tablet { max-width: 820px !important; margin: 0 auto; }
    .iframe-device-desktop { max-width: 1440px !important; margin: 0 auto; }
    
    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7); }
      70% { box-shadow: 0 0 0 5px rgba(25, 135, 84, 0); }
      100% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
    }
    .animate-pulse {
      animation: pulse-green 2s infinite;
      border-radius: 50%;
    }
  </style>
</head>
<body class="admin-body">

  <div class="d-flex" style="height: 100vh; overflow: hidden;">
    <!-- Sidebar Container -->
    <div id="admin-sidebar-container" style="flex-shrink: 0; z-index: 1050;"></div>
    
    <!-- Left CMS Controls (Scrollable) -->
    <div class="cms-controls d-flex flex-column" style="flex: 0 0 420px; background-color: #F8F7F4; border-right: 1px solid #e0e0e0; position: relative;">
      
      <!-- Sticky CMS Header -->
      <div class="p-4 bg-white border-bottom shadow-sm sticky-top z-index-1000 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-start gap-3">
          <a href="dashboard.html" class="btn btn-sm btn-light border shadow-sm rounded-circle d-flex align-items-center justify-content-center mt-1" style="width: 32px; height: 32px;" title="Back to Dashboard">
            <i class="bi bi-arrow-left text-secondary"></i>
          </a>
          <div>
            <h2 class="font-serif fw-bold text-purple mb-1 fs-4">Website CMS</h2>
            <p class="text-secondary small mb-0">Live editing landing page</p>
          </div>
        </div>
        <button class="btn btn-purple btn-sm rounded-pill px-3 shadow-sm" id="btnPublishCms">
          <i class="bi bi-cloud-check me-1"></i> Publish
        </button>
      </div>

      <!-- CMS Accordion Editor -->
      <div class="p-3 overflow-auto flex-grow-1" id="cmsEditorContainer">
        
        <div class="accordion accordion-flush rounded overflow-hidden shadow-sm" id="cmsAccordion">
          
          <!-- Hero Section -->
          <div class="accordion-item border-0 mb-2 rounded shadow-sm">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed fw-bold text-dark bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#collapseHero">
                <i class="bi bi-image text-primary me-2"></i> Hero Banner
              </button>
            </h2>
            <div id="collapseHero" class="accordion-collapse collapse" data-bs-parent="#cmsAccordion">
              <div class="accordion-body bg-light">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Heading</label>
                  <textarea class="form-control form-control-sm" id="cmsHeroHeading" rows="2"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Subheading</label>
                  <textarea class="form-control form-control-sm" id="cmsHeroSubheading" rows="2"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Background Image URL</label>
                  <div class="input-group input-group-sm">
                    <input type="text" class="form-control" id="cmsHeroImage" placeholder="assets/images/...">
                    <input type="file" class="d-none" id="cmsHeroImageUpload" accept="image/*">
                    <button class="btn btn-outline-secondary" type="button" id="btnUploadHeroImage" title="Upload Image"><i class="bi bi-upload"></i></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- About Us Section -->
          <div class="accordion-item border-0 mb-2 rounded shadow-sm">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed fw-bold text-dark bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAbout">
                <i class="bi bi-info-circle text-info me-2"></i> About Us
              </button>
            </h2>
            <div id="collapseAbout" class="accordion-collapse collapse" data-bs-parent="#cmsAccordion">
              <div class="accordion-body bg-light">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Section Heading</label>
                  <input type="text" class="form-control form-control-sm" id="cmsAboutHeading">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Subheading</label>
                  <input type="text" class="form-control form-control-sm" id="cmsAboutSubheading">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Brand History / Description</label>
                  <textarea class="form-control form-control-sm" id="cmsAboutHistory" rows="5"></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- Footer Settings -->
          <div class="accordion-item border-0 mb-2 rounded shadow-sm">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed fw-bold text-dark bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFooter">
                <i class="bi bi-layout-text-window-reverse text-secondary me-2"></i> Footer Contacts
              </button>
            </h2>
            <div id="collapseFooter" class="accordion-collapse collapse" data-bs-parent="#cmsAccordion">
              <div class="accordion-body bg-light">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Phone Numbers</label>
                  <input type="text" class="form-control form-control-sm" id="cmsFooterPhone">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Email Address</label>
                  <input type="text" class="form-control form-control-sm" id="cmsFooterEmail">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Branch Locations Text</label>
                  <input type="text" class="form-control form-control-sm" id="cmsFooterAddress">
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
    
    <!-- Right Live Preview (Iframe) -->
    <div class="cms-preview flex-grow-1 d-flex flex-column position-relative" style="background-color: #e5e5e5;">
      
      <!-- Toolbar -->
      <div class="d-flex justify-content-between align-items-center p-3 bg-white border-bottom shadow-sm">
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3 py-2 border border-success"><i class="bi bi-record-circle me-1 animate-pulse"></i> Live Preview Mode</span>
        </div>
        
        <div class="btn-group btn-group-sm shadow-sm" role="group" aria-label="Device Preview Modes">
          <button type="button" class="btn btn-outline-secondary active" id="btnPreviewDesktop" title="Desktop View"><i class="bi bi-display"></i></button>
          <button type="button" class="btn btn-outline-secondary" id="btnPreviewTablet" title="Tablet View"><i class="bi bi-tablet"></i></button>
          <button type="button" class="btn btn-outline-secondary" id="btnPreviewMobile" title="Mobile View"><i class="bi bi-phone"></i></button>
        </div>
        
        <div>
          <a href="../../../index.html" target="_blank" class="btn btn-light btn-sm shadow-sm border"><i class="bi bi-box-arrow-up-right text-purple"></i> Open Site</a>
        </div>
      </div>
      
      <!-- Canvas Wrapper -->
      <div class="flex-grow-1 position-relative d-flex justify-content-center pt-4 pb-0 px-4" style="overflow-y: auto; overflow-x: hidden;" id="iframeCanvasWrapper">
        <div id="iframeDeviceContainer" class="iframe-device-desktop" style="width: 100%; transition: max-width 0.3s ease; height: fit-content; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border-radius: 8px 8px 0 0; overflow: hidden; border: 1px solid #ccc; background: white;">
          <iframe id="livePreviewFrame" src="../../../index.html" style="width: 100%; height: calc(100vh - 80px); border: none; display: block; background: white;"></iframe>
        </div>
      </div>
      
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;">
    <div id="statusToast" class="toast align-items-center text-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body small" id="toastMessage">Updates published successfully.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../Shared/UtilityClass/session.js"></script>
  <script src="../../../Shared/UtilityClass/state.js"></script>
  <script src="components/admin-sidebar.js"></script>
  <script src="content.js"></script>
</body>
</html>
